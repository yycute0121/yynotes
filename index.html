<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EFEAE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小羊">
<title>小羊 · 个人物品与事务管理</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<script>
/* 在样式生效前定好主题，避免首屏闪色。
   三态：auto 跟随系统 / light 锁定奶油浅色 / dark 锁定深色。
   默认 light —— 奶油浅米杏是这个应用的主视觉。 */
(function () {
  var mode = 'light';
  try {
    var saved = localStorage.getItem('wb_theme');
    if (saved === 'auto' || saved === 'dark' || saved === 'light') mode = saved;
  } catch (e) { /* 隐私模式下忽略 */ }

  var root = document.documentElement;
  root.setAttribute('data-theme', mode);

  var dark = mode === 'dark' ||
    (mode === 'auto' && window.matchMedia &&
     matchMedia('(prefers-color-scheme: dark)').matches);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#23211E' : '#EFEAE3');
})();
</script>
</head>
<body>
<div id="app" class="app-shell"></div>

<div id="sheet-root" class="sheet-root" aria-live="polite"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
<div id="viewer-root" class="viewer-root" hidden></div>

<script src="js/store.js"></script>
<script src="js/image.js"></script>
<script src="js/ui.js"></script>
<script src="js/common.js"></script>
<script src="js/backup.js"></script>
<script src="js/health.js"></script>
<script src="js/wardrobe.js"></script>
<script src="js/devices.js"></script>
<script src="js/inventory.js"></script>
<script src="js/events.js"></script>
<script src="js/app.js"></script>
</body>
</html>
